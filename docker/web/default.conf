# The rules of public/.htaccess. PHP runs in the app service, which has the
# code at the same path, so SCRIPT_FILENAME is valid there.
server {
    listen 80;
    server_name _;
    root /var/www/tw2-stats/public;
    index index.php;
    # Redirects are sent as paths, so they keep the proxy's scheme and host
    absolute_redirect off;
    # Docker's DNS, which finds the app service again after it's recreated
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Redirect trailing slashes if not a folder (the query string is kept)
    if (!-d $request_filename) {
        rewrite ^(.+)/$ $1 permanent;
    }

    # Send requests to the front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Apache's default configuration denies .ht* files
    location ~ /\.ht {
        deny all;
    }

    # The front controller is the only PHP that runs, and other paths with
    # .php in them, in any case, go to it as well, so no PHP file is ever sent
    # as it is. The Authorization header is passed with the others, as
    # HTTP_AUTHORIZATION.
    location ~* \.php {
        rewrite ^ /index.php last;
    }

    location = /index.php {
        # Keep responses containing session tokens out of gzip compression.
        # The outer reverse proxy must also leave these responses uncompressed.
        gzip off;
        # tw2-stats-php, not app, which can be another service on the proxy's network
        set $php_fpm tw2-stats-php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass $php_fpm;
    }
}
